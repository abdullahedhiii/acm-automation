<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coders Cup'25 Credentials</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Hoshiko Satsuki';
      src: url('https://dl.dafont.com/dl/?f=hoshiko_satsuki') format('truetype');
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #ffffff; font-family: 'Outfit', Arial, sans-serif; display: flex; justify-content: center;">
  <div style="max-width: 600px; width: 100%; background: linear-gradient(to bottom right, #8B0000, #1A1A1A); color: #E5E5E5; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); overflow: hidden; margin: 20px;">

    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 30px 35px 10px;">
      <div style="display: flex; align-items: center;">
        <!-- DevDay Logo -->
        <img src="new png.png" alt="Coders Cup Logo" style="width: 100px; height: auto; vertical-align: middle;">
        
        <!-- Vertical Divider Line -->
        <div style="width: 2px; height: 40px; background-color: #F0C93D; margin: 0 12px;"></div>

        <!-- Event Name -->
        <span style="font-family: 'Hoshiko Satsuki', cursive; font-size: 28px; color: #F0C93D; vertical-align: middle;">Coders Cup ’25</span>
      </div>

      <!-- ACM Logo -->
      <img src="acm-logo.png" alt="ACM Logo" style="width: 105px; height: auto;">
    </div>

    <!-- Main Content -->
    <div style="padding: 0 35px 20px; line-height: 1.6; font-size: 15px; color: #E5E5E5;">
      <p>Hi <strong>{team_name}</strong>,</p>
      <p>
        Congratulations! You've successfully registered for the <strong>{competition_name}</strong> competition at Coders Cup 2025.
      </p>

      <h3 style="margin-top: 25px; color: #F0C93D;">Team details,</h3>

      <!-- Credentials Box -->
      <div style="background: #1A1A1A; border-left: 4px solid #C1121F; border-radius: 8px; padding: 15px 20px; margin: 20px 0; font-size: 15px;">
        <p style="margin: 5px 0; color: #F0C93D;"><strong>Member 1:</strong> <span style="color:#FFFFFF;">{Member Name}</span></p>
        <p style="margin: 5px 0; color: #F0C93D;"><strong>Member 2:</strong> <span style="color:#FFFFFF;">{Member Name}</span></p>
        <p style="margin: 5px 0; color: #F0C93D;"><strong>Member 3:</strong> <span style="color:#FFFFFF;">{Member Name}</span></p>
      </div>
    </div>

    <!-- Footer -->
    <div style="border-top: 1px solid rgba(255,255,255,0.2); text-align: center; padding: 25px 20px 20px;">
      <p style="margin: 0 0 10px; font-size: 14px; color: #F0C93D; letter-spacing: 0.5px;">STAY CONNECTED</p>

      <!-- Social Icons -->
      <div style="margin: 10px 0;">
        <a href="https://www.linkedin.com" style="margin: 0 8px; text-decoration: none;">
          <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" width="24" height="24">
        </a>
        <a href="https://www.facebook.com" style="margin: 0 8px; text-decoration: none;">
          <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" width="24" height="24">
        </a>
        <a href="https://www.instagram.com" style="margin: 0 8px; text-decoration: none;">
          <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram" width="24" height="24">
        </a>
      </div>

      <p style="margin: 10px 0 0; font-size: 13px; color: #D1D5DB;">
        Coders Cup’25<br>
        Contact: <a href="mailto:cc2025-support@coderscup.org" style="color: #F0C93D; text-decoration: none;">cc2025-support@coderscup.org</a>
      </p>
    </div>

  </div>
</body>
</html>
